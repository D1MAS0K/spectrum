[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectrum"
version = "1.0.0"
description = "Spectrum — AI-powered e-commerce automation platform for pet industry dominance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "DogsState"}]

dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "anthropic>=0.40,<1",
    "openai>=1.50,<2",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12,<5",
    "Pillow>=10.2,<11",
    "rich>=13.7,<14",
    "typer>=0.12,<1",
    "tenacity>=8.2,<9",
    "structlog>=24.1,<25",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "google-api-python-client>=2.100,<3",
    "google-auth-oauthlib>=1.2,<2",
    "feedparser>=6.0,<7",
    "markdownify>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.8,<2",
]

[project.scripts]
spectrum = "spectrum.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
